services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped

        env_file:
            - path: .env
              required: false

        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8000

            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: zernio_chat
            DB_USERNAME: zernio
            DB_PASSWORD: zernio123

            BROADCAST_CONNECTION: reverb

            REVERB_APP_ID: zernio-chat
            REVERB_APP_KEY: zernio-chat-key
            REVERB_APP_SECRET: zernio-chat-secret

            REVERB_HOST: reverb
            REVERB_PORT: 8080

            REVERB_SERVER_HOST: 0.0.0.0
            REVERB_SERVER_PORT: 8080

            RUN_MIGRATIONS: "true"

        depends_on:
            mysql:
                condition: service_healthy
            reverb:
                condition: service_started

        ports:
            - "8000:8000"

        volumes:
            - ./storage:/var/www/storage

        command:
            - sh
            - -c
            - |
                php artisan migrate --force
                php artisan storage:link --force || true
                exec php artisan serve --host=0.0.0.0 --port=8000 --no-reload

    reverb:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped

        env_file:
            - path: .env
              required: false

        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8000

            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: zernio_chat
            DB_USERNAME: zernio
            DB_PASSWORD: zernio123

            REVERB_APP_ID: zernio-chat
            REVERB_APP_KEY: zernio-chat-key
            REVERB_APP_SECRET: zernio-chat-secret

            REVERB_SERVER_HOST: 0.0.0.0
            REVERB_SERVER_PORT: 8080

            RUN_MIGRATIONS: "false"

        depends_on:
            mysql:
                condition: service_healthy

        ports:
            - "8080:8080"

        volumes:
            - ./storage:/var/www/storage

        command:
            - php
            - artisan
            - reverb:start
            - --host=0.0.0.0
            - --port=8080


    mysql:
        image: mysql:8.0
        restart: unless-stopped

        environment:
            MYSQL_DATABASE: zernio_chat
            MYSQL_USER: zernio
            MYSQL_PASSWORD: zernio123
            MYSQL_ROOT_PASSWORD: root123

        ports:
            - "3307:3306"

        volumes:
            - zernio_mysql_data:/var/lib/mysql

        healthcheck:
            test:
              [
                  "CMD",
                  "mysqladmin",
                  "ping",
                  "-h",
                  "localhost",
                  "-uroot",
                  "-proot123"
              ]
            interval: 5s
            timeout: 5s
            retries: 20


volumes:
    zernio_mysql_data:
        name: zernio-chat_zernio_mysql_data
